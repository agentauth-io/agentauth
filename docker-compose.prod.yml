version: '3.8'

# AgentAuth Production Stack
# Run with: docker-compose -f docker-compose.prod.yml up -d

services:
  # ==========================================================================
  # AgentAuth API (scalable)
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    # Internal port only - access via nginx
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql://agentauth:${DB_PASSWORD}@postgres:5432/agentauth
      - REDIS_URL=redis://redis:6379
      - AGENTAUTH_MASTER_SECRET=${MASTER_SECRET}
      - ENVIRONMENT=production
      - RATE_LIMIT_PER_MINUTE=100
    depends_on:
      - postgres
      - redis
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agentauth-net
    restart: unless-stopped

  # ==========================================================================
  # PostgreSQL (persistent storage)
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=agentauth
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=agentauth
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # Optional init script
    # ports:
    #   - "5432:5432"  # Only expose if needed for debugging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentauth"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentauth-net
    restart: unless-stopped

  # ==========================================================================
  # Redis (caching, rate limiting, sessions)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # ports:
    #   - "6379:6379"  # Only expose if needed for debugging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentauth-net
    restart: unless-stopped

  # ==========================================================================
  # Nginx (load balancer, SSL termination)
  # ==========================================================================
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      # - "8443:443"  # Enable for production with SSL
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Production config with SSL
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - agentauth-net
    restart: unless-stopped

  # ==========================================================================
  # Prometheus (metrics collection)
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - agentauth-net
    restart: unless-stopped

  # ==========================================================================
  # Grafana (dashboards)
  # ==========================================================================
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - agentauth-net
    restart: unless-stopped

  # ==========================================================================
  # pgAdmin (database management)
  # ==========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - agentauth-net
    restart: unless-stopped
    profiles:
      - tools

# ==========================================================================
# Networks
# ==========================================================================
networks:
  agentauth-net:
    driver: bridge

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
