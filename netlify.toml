# Netlify configuration - deploy frontend with video hero
[build]
  # Build from frontend folder
  base = "frontend"
  # Publish the dist folder (built output)
  publish = "dist"
  # Build command
  command = "npm install && npx vite build"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Handle SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
