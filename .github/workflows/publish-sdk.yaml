# Publish SDKs to package registries
name: Publish SDKs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: 'Publish Python SDK to PyPI'
        type: boolean
        default: true
      publish_npm:
        description: 'Publish CLI to npm'
        type: boolean
        default: true

jobs:
  # ==========================================================================
  # Publish Python SDK to PyPI
  # ==========================================================================
  publish-python:
    name: Publish Python SDK
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.publish_pypi == 'true'
    
    permissions:
      id-token: write  # For trusted publishing
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        working-directory: sdk/python
        run: python -m build
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
          # Uses trusted publishing (OIDC) - no token needed if configured
          # Or use: password: ${{ secrets.PYPI_API_TOKEN }}

  # ==========================================================================
  # Publish CLI to npm
  # ==========================================================================
  publish-npm:
    name: Publish CLI to npm
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.publish_npm == 'true'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        working-directory: cli
        run: npm ci
      
      - name: Build CLI
        working-directory: cli
        run: npm run build
      
      - name: Publish to npm
        working-directory: cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ==========================================================================
  # Update documentation
  # ==========================================================================
  update-docs:
    name: Update Documentation
    runs-on: ubuntu-latest
    needs: [publish-python, publish-npm]
    if: always() && (needs.publish-python.result == 'success' || needs.publish-npm.result == 'success')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Build docs site
        working-directory: agentauth-site
        run: |
          npm ci
          npm run build
      
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './agentauth-site/out'
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        if: env.NETLIFY_AUTH_TOKEN != ''
