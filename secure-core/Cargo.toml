[package]
name = "agentauth-secure-core"
version = "0.1.0"
edition = "2021"
authors = ["AgentAuth Team"]
description = "Memory-safe cryptographic core for AgentAuth authorization network"
license = "MIT"
repository = "https://github.com/agentauth/agentauth"
keywords = ["cryptography", "security", "authorization", "ed25519", "zero-knowledge"]
categories = ["cryptography", "authentication"]

[lib]
name = "agentauth_core"
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "agentauth-keygen"
path = "src/bin/keygen.rs"

[features]
default = ["std", "alloc"]
std = ["ring/std", "zeroize/std"]
alloc = ["zeroize/alloc"]
hsm = ["pkcs11"]
wasm = ["wasm-bindgen", "getrandom/js"]

[dependencies]
# Core cryptography
ring = "0.17"
ed25519-dalek = { version = "2.1", features = ["rand_core", "digest"] }
x25519-dalek = { version = "2.0", features = ["reusable_secrets"] }
chacha20poly1305 = "0.10"
blake3 = "1.5"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"

# Secure memory handling
zeroize = { version = "1.7", features = ["derive"] }
secrecy = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
hex = "0.4"

# Random number generation
rand = "0.8"
rand_core = "0.6"
getrandom = "0.2"

# Time and utils
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Optional: HSM support
pkcs11 = { version = "0.5", optional = true }

# Optional: WASM support
wasm-bindgen = { version = "0.2", optional = true }

# Async runtime (optional)
tokio = { version = "1.35", features = ["rt-multi-thread", "sync"], optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
tokio-test = "0.4"

[[bench]]
name = "crypto_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
