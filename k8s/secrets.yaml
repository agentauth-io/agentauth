# AgentAuth Secrets - Replace with actual values or use external secrets manager
apiVersion: v1
kind: Secret
metadata:
  name: agentauth-secrets
  namespace: agentauth
type: Opaque
stringData:
  # Database
  POSTGRES_PASSWORD: "CHANGE_ME_USE_STRONG_PASSWORD"
  DATABASE_URL: "postgresql://agentauth:CHANGE_ME_USE_STRONG_PASSWORD@postgres-service:5432/agentauth"
  
  # Redis
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
  REDIS_URL: "redis://:CHANGE_ME_REDIS_PASSWORD@redis-service:6379/0"
  
  # AgentAuth Master Secret (32 bytes hex)
  MASTER_SECRET: "GENERATE_WITH_openssl_rand_hex_32"
  
  # API Keys for internal services
  API_KEY_INTERNAL: "GENERATE_STRONG_API_KEY"

---
