# AgentAuth Advanced Security Infrastructure
# Enterprise-grade deployment with all security components

version: '3.8'

services:
  # ============================================
  # Core API with Advanced Security
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "8080:8000"
    environment:
      - DATABASE_URL=postgresql://agentauth:${DB_PASSWORD}@postgres:5432/agentauth
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - ENABLE_ML_THREAT_DETECTION=true
      - ENABLE_BLOCKCHAIN_AUDIT=true
      - ENABLE_ZERO_TRUST_MESH=true
      - CONSENSUS_NODES=consensus-1:8000,consensus-2:8000,consensus-3:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started
    networks:
      - agentauth-mesh
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Go Edge Gateway with mTLS
  # ============================================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "443:8443"
      - "8081:8080"
    environment:
      - UPSTREAM_URL=http://api:8000
      - TLS_CERT_FILE=/certs/server.crt
      - TLS_KEY_FILE=/certs/server.key
      - TLS_CA_FILE=/certs/ca.crt
      - REQUIRE_CLIENT_CERT=true
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - VAULT_ADDR=http://vault:8200
    volumes:
      - ./certs:/certs:ro
    depends_on:
      - api
    networks:
      - agentauth-mesh
    deploy:
      replicas: 2

  # ============================================
  # Distributed Consensus Nodes
  # ============================================
  consensus-1:
    build:
      context: .
      dockerfile: Dockerfile.consensus
    environment:
      - NODE_ID=node-1
      - CLUSTER_PEERS=consensus-2:8000,consensus-3:8000,consensus-4:8000
      - DATABASE_URL=postgresql://agentauth:${DB_PASSWORD}@postgres:5432/agentauth
    networks:
      - agentauth-mesh
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  consensus-2:
    build:
      context: .
      dockerfile: Dockerfile.consensus
    environment:
      - NODE_ID=node-2
      - CLUSTER_PEERS=consensus-1:8000,consensus-3:8000,consensus-4:8000
      - DATABASE_URL=postgresql://agentauth:${DB_PASSWORD}@postgres:5432/agentauth
    networks:
      - agentauth-mesh

  consensus-3:
    build:
      context: .
      dockerfile: Dockerfile.consensus
    environment:
      - NODE_ID=node-3
      - CLUSTER_PEERS=consensus-1:8000,consensus-2:8000,consensus-4:8000
      - DATABASE_URL=postgresql://agentauth:${DB_PASSWORD}@postgres:5432/agentauth
    networks:
      - agentauth-mesh

  consensus-4:
    build:
      context: .
      dockerfile: Dockerfile.consensus
    environment:
      - NODE_ID=node-4
      - CLUSTER_PEERS=consensus-1:8000,consensus-2:8000,consensus-3:8000
      - DATABASE_URL=postgresql://agentauth:${DB_PASSWORD}@postgres:5432/agentauth
    networks:
      - agentauth-mesh

  # ============================================
  # HashiCorp Vault
  # ============================================
  vault:
    image: hashicorp/vault:1.15
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_TOKEN}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_LOCAL_CONFIG={"backend":{"file":{"path":"/vault/data"}},"listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":1}}}
    volumes:
      - vault-data:/vault/data
    cap_add:
      - IPC_LOCK
    networks:
      - agentauth-mesh
    command: server -dev

  # ============================================
  # PostgreSQL with TimescaleDB
  # ============================================
  postgres:
    image: timescale/timescaledb:latest-pg15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=agentauth
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=agentauth
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/
    networks:
      - agentauth-mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentauth"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis Cluster (Sentinel)
  # ============================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - agentauth-mesh
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-sentinel-1:
    image: redis:7-alpine
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis
    networks:
      - agentauth-mesh

  # ============================================
  # OpenTelemetry Collector
  # ============================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics
    volumes:
      - ./otel/config.yaml:/etc/otel-collector-config.yaml
    command: --config=/etc/otel-collector-config.yaml
    networks:
      - agentauth-mesh

  # ============================================
  # Jaeger for Distributed Tracing
  # ============================================
  jaeger:
    image: jaegertracing/all-in-one:1.51
    ports:
      - "16686:16686"  # UI
      - "14268:14268"  # HTTP collector
      - "6831:6831/udp"  # Agent
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - agentauth-mesh

  # ============================================
  # Prometheus
  # ============================================
  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - agentauth-mesh

  # ============================================
  # Grafana
  # ============================================
  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - agentauth-mesh

  # ============================================
  # Nginx Load Balancer
  # ============================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - gateway
    networks:
      - agentauth-mesh

  # ============================================
  # Certificate Manager (cfssl)
  # ============================================
  cfssl:
    image: cfssl/cfssl:latest
    volumes:
      - ./certs:/certs
      - ./cfssl:/cfssl
    command: serve -address=0.0.0.0 -port=8888 -ca=/cfssl/ca.pem -ca-key=/cfssl/ca-key.pem
    networks:
      - agentauth-mesh

  # ============================================
  # Log Aggregation (Loki)
  # ============================================
  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - agentauth-mesh

  # ============================================
  # Log Collector (Promtail)
  # ============================================
  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - /var/log:/var/log:ro
      - ./promtail/config.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - agentauth-mesh

  # ============================================
  # WASM Policy Engine (Wasmtime)
  # ============================================
  policy-engine:
    build:
      context: ./wasm-policy
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      - WASM_MODULE=/app/policy_engine.wasm
      - RULES_PATH=/app/rules
    volumes:
      - ./wasm-policy/rules:/app/rules
    networks:
      - agentauth-mesh

networks:
  agentauth-mesh:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
  redis-data:
  vault-data:
  prometheus-data:
  grafana-data:
  loki-data:
