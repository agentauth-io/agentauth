# Koyeb Deployment Configuration
# https://www.koyeb.com/docs/reference/koyeb-file-reference

name: agentauth-api

service:
  type: web
  
  # Build configuration
  git:
    branch: main
    build_command: pip install -r requirements.txt
    run_command: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4
  
  # Or use Docker
  # docker:
  #   dockerfile: Dockerfile
  
  # Instance configuration
  instance_type: nano  # nano, micro, small, medium, large, xlarge
  
  # Scaling
  scaling:
    min: 1
    max: 3
  
  # Health check
  health_checks:
    - type: http
      path: /health
      port: 8000
      interval: 30
      timeout: 30
      healthy_threshold: 2
      unhealthy_threshold: 5
      initial_delay: 15
  
  # Environment variables (set these in Koyeb dashboard for secrets)
  env:
    - key: PORT
      value: "8000"
    - key: ENVIRONMENT
      value: "production"
    - key: DEBUG
      value: "false"
    # Set these as secrets in Koyeb dashboard:
    # - DATABASE_URL
    # - REDIS_URL
    # - MASTER_SECRET
    # - SECRET_KEY
    # - STRIPE_SECRET_KEY
    # - STRIPE_WEBHOOK_SECRET

  # Ports
  ports:
    - port: 8000
      protocol: http

  # Routes
  routes:
    - path: /
      port: 8000
