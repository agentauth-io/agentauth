# Render.com deployment configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: agentauth-api
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn production_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: REDIS_URL
        sync: false  # Set manually in Render dashboard  
      - key: SECRET_KEY
        generateValue: true
      - key: MASTER_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false  # Set manually in Render dashboard
      - key: STRIPE_WEBHOOK_SECRET
        sync: false  # Set manually in Render dashboard
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "https://agentauth.in,https://www.agentauth.in,https://agentauth-production.up.railway.app"
