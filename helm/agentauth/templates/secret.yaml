{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentauth.fullname" . }}
  labels:
    {{- include "agentauth.labels" . | nindent 4 }}
type: Opaque
stringData:
  master-secret: {{ .Values.secrets.masterSecret | quote }}
  {{- if .Values.secrets.databaseUrl }}
  database-url: {{ .Values.secrets.databaseUrl | quote }}
  {{- else if .Values.postgresql.enabled }}
  database-url: "postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "agentauth.postgresql.host" . }}:{{ include "agentauth.postgresql.port" . }}/{{ .Values.postgresql.auth.database }}"
  {{- end }}
  {{- if .Values.secrets.redisUrl }}
  redis-url: {{ .Values.secrets.redisUrl | quote }}
  {{- else if .Values.redis.enabled }}
  redis-url: "redis://:{{ .Values.redis.auth.password }}@{{ include "agentauth.redis.host" . }}:{{ include "agentauth.redis.port" . }}/0"
  {{- end }}
{{- end }}
