apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentauth.fullname" . }}-config
  labels:
    {{- include "agentauth.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  RATE_LIMIT_PER_MINUTE: {{ .Values.config.rateLimitPerMinute | quote }}
  TOKEN_EXPIRY_SECONDS: {{ .Values.config.tokenExpirySeconds | quote }}
  RISK_THRESHOLD_HIGH: {{ .Values.config.riskThresholdHigh | quote }}
