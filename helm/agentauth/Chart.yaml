apiVersion: v2
name: agentauth
description: AgentAuth - AI Agent Authorization Infrastructure
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - ai
  - agents
  - authorization
  - security
  - authentication

home: https://agentauth.io
sources:
  - https://github.com/agentauth/agentauth

maintainers:
  - name: AgentAuth Team
    email: team@agentauth.io

dependencies:
  - name: postgresql
    version: "13.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "18.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
