# =============================================================================
# AgentAuth Helm Chart Values
# =============================================================================

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Number of API replicas
replicaCount: 3

# Image configuration
image:
  repository: agentauth/api
  tag: "latest"
  pullPolicy: IfNotPresent

# Image pull secrets
imagePullSecrets: []

# Override chart name
nameOverride: ""
fullnameOverride: ""

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/v1/metrics"

# Pod security context
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Service configuration
service:
  type: ClusterIP
  port: 8000
  annotations: {}

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.agentauth.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: agentauth-tls
      hosts:
        - api.agentauth.io

# Resource limits
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

# Autoscaling
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity - spread across nodes
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - agentauth
          topologyKey: kubernetes.io/hostname

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Health probes
probes:
  startup:
    enabled: true
    path: /health
    failureThreshold: 30
    periodSeconds: 2
  liveness:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# =============================================================================
# Application Configuration
# =============================================================================

config:
  environment: production
  logLevel: INFO
  rateLimitPerMinute: 100
  tokenExpirySeconds: 3600
  riskThresholdHigh: 0.7

# =============================================================================
# Secrets Configuration
# =============================================================================

secrets:
  # Set to true to create secrets from values, false to use existing secrets
  create: true
  # Name of existing secret (if create is false)
  existingSecret: ""
  
  # Values (only used if create is true - DO NOT commit real values!)
  masterSecret: ""  # Generate with: openssl rand -hex 32
  databaseUrl: ""   # postgresql://user:pass@host:5432/db
  redisUrl: ""      # redis://:password@host:6379/0

# =============================================================================
# External Secrets (for production with Vault, AWS Secrets Manager, etc.)
# =============================================================================

externalSecrets:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  keys:
    masterSecret: agentauth/production/master_secret
    databaseUrl: agentauth/production/database_url
    redisUrl: agentauth/production/redis_url

# =============================================================================
# PostgreSQL (Bitnami subchart)
# =============================================================================

postgresql:
  enabled: true
  auth:
    database: agentauth
    username: agentauth
    password: ""  # Generate and set securely
    existingSecret: ""
  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: ""
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi

# External PostgreSQL (if postgresql.enabled is false)
externalPostgresql:
  host: ""
  port: 5432
  database: agentauth
  username: agentauth
  existingSecret: ""
  existingSecretPasswordKey: password

# =============================================================================
# Redis (Bitnami subchart)
# =============================================================================

redis:
  enabled: true
  auth:
    enabled: true
    password: ""  # Generate and set securely
    existingSecret: ""
  master:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 2Gi
  replica:
    replicaCount: 0  # Set to 2+ for HA

# External Redis (if redis.enabled is false)
externalRedis:
  host: ""
  port: 6379
  existingSecret: ""
  existingSecretPasswordKey: password

# =============================================================================
# Network Policies
# =============================================================================

networkPolicy:
  enabled: true
  allowExternal: false
  ingressRules:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: monitoring

# =============================================================================
# Monitoring
# =============================================================================

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 15s
    scrapeTimeout: 10s
    labels: {}

# Grafana dashboard ConfigMap
grafanaDashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"
