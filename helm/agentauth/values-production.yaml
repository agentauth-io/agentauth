# =============================================================================
# AgentAuth Helm Chart - Production Values
# =============================================================================

replicaCount: 3

image:
  pullPolicy: IfNotPresent

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

ingress:
  hosts:
    - host: api.agentauth.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: agentauth-tls
      hosts:
        - api.agentauth.io

config:
  environment: production
  logLevel: INFO
  rateLimitPerMinute: 100
  tokenExpirySeconds: 3600
  riskThresholdHigh: 0.7

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 2

postgresql:
  primary:
    persistence:
      size: 100Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi

redis:
  master:
    persistence:
      size: 10Gi
  replica:
    replicaCount: 2
